<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JUST US ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    background: linear-gradient(135deg,#10081f,#35103f,#70265e);
    background-size: 300% 300%;
    animation: backgroundGlow 15s ease infinite;
    overflow-x: hidden;
}

@keyframes backgroundGlow {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* FLOATING ROMANTIC BACKGROUND */

#floating-romance {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.floating-item {
    position: absolute;
    bottom: -60px;
    animation: floatUp linear forwards;
    opacity: 0;
    user-select: none;
    filter: drop-shadow(0 0 8px rgba(255,130,200,.5));
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% {opacity: .7;}
    85% {opacity: .7;}
    100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
    }
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 22px;
    position: relative;
    z-index: 1;
}

header {
    text-align: center;
    padding: 38px 10px;
}

header h1 {
    font-size: 45px;
    letter-spacing: 6px;
    color: #ffb9e8;
    text-shadow:
        0 0 10px #ff5ac8,
        0 0 30px #ff5ac8;
    animation: titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    from {text-shadow: 0 0 10px #ff5ac8;}
    to {text-shadow: 0 0 30px #ff5ac8,0 0 50px #b84fff;}
}

header p {
    margin-top: 14px;
    color: #ffd1ef;
    font-size: 14px;
    letter-spacing: 1px;
}

.card {
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.19);
    border-radius: 23px;
    padding: 25px;
    margin-bottom: 20px;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
    transition: transform .3s, box-shadow .3s;
}

.card:hover {
    box-shadow: 0 12px 40px rgba(255,90,200,.12);
}

input, textarea {
    width: 100%;
    padding: 15px;
    margin: 9px 0;
    border: 1px solid transparent;
    outline: none;
    border-radius: 13px;
    background: rgba(255,255,255,.96);
    color: #35134d;
    font-size: 15px;
}

input:focus, textarea:focus {
    border-color: #ff75cf;
    box-shadow: 0 0 12px rgba(255,100,200,.35);
}

button {
    border: none;
    padding: 13px 19px;
    border-radius: 13px;
    background: linear-gradient(90deg,#e85bb5,#a66bff);
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 2px;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 4px 15px rgba(232,91,181,.2);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(232,91,181,.5);
}

button:active {
    transform: scale(.96);
}

.full {
    width: 100%;
}

.hidden {
    display: none !important;
}

nav {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin-bottom: 20px;
    padding-bottom: 5px;
}

nav button {
    flex: 1;
    white-space: nowrap;
    padding: 12px 9px;
}

.message {
    padding: 13px;
    margin: 10px 0;
    border-radius: 15px;
    max-width: 85%;
    background: rgba(117,77,136,.9);
    overflow-wrap: anywhere;
    border: 1px solid rgba(255,255,255,.1);
}

.mine {
    margin-left: auto;
    background: linear-gradient(120deg,#b74b9e,#843eae);
}

.message small {
    display: block;
    font-size: 10px;
    opacity: .7;
    margin-top: 6px;
}

.gallery img {
    width: 100%;
    border-radius: 15px;
    margin-top: 12px;
}

.gallery {
    margin-bottom: 20px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #eab8e5;
    font-size: 13px;
    line-height: 1.8;
}

#status {
    text-align: center;
    font-size: 13px;
    color: #ffc8ed;
    margin: 12px;
}

@media(max-width:480px) {
    header h1 {
        font-size: 36px;
    }

    .container {
        padding: 15px;
    }

    .card {
        padding: 19px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div id="floating-romance"></div>

<div class="container">

<header>
    <h1>JUST US</h1>
    <p>Two souls. One private universe. ✨</p>
</header>

<div id="loginScreen" class="card">

    <h2 style="text-align:center">Welcome Home ❤️</h2>

    <p style="text-align:center;margin:15px">
        ANTHELEM & OLLEN
    </p>

    <input id="email" type="email"
    placeholder="Your email address">

    <input id="password" type="password"
    placeholder="Your password">

    <button class="full" onclick="login()">
        Enter Our Universe ✨
    </button>

    <p id="loginError" style="color:#ffb6c8;text-align:center"></p>

</div>

<div id="app" class="hidden">

    <div class="card" style="text-align:center">
        <h2 id="welcome"></h2>
        <p style="margin-top:10px">
            Welcome back to our little universe ❤️
        </p>
    </div>

    <nav>
        <button onclick="showPage('chat')">💬 Chat</button>
        <button onclick="showPage('cards')">💌 Love Cards</button>
        <button onclick="showPage('memories')">📸 Memories</button>
    </nav>

    <!-- CHAT -->

    <section id="chat" class="page card">

        <h2>Our Private Chat 💬</h2>

        <div id="messages"
        style="margin-top:20px;max-height:350px;overflow-y:auto">
        </div>

        <textarea id="messageInput"
        placeholder="Write something special..."></textarea>

        <button class="full" onclick="sendMessage()">
            Send Message ❤️
        </button>

    </section>

    <!-- LOVE CARDS -->

    <section id="cards" class="page card hidden">

        <h2>Our Love Cards 💌</h2>

        <input id="cardTitle" placeholder="Card title">

        <textarea id="cardMessage"
        placeholder="Write your special message..."></textarea>

        <input id="cardImage" type="file" accept="image/*">

        <button class="full" onclick="uploadCard()">
            Upload Love Card 💗
        </button>

        <div id="cardGallery" class="gallery"></div>

    </section>

    <!-- MEMORIES -->

    <section id="memories" class="page card hidden">

        <h2>Our Memories 📸</h2>

        <p style="margin:12px 0">
            Every picture tells a story.
        </p>

        <input id="memoryImage" type="file" accept="image/*">

        <button class="full" onclick="uploadMemory()">
            Save Memory ❤️
        </button>

        <div id="memoryGallery" class="gallery"></div>

    </section>

    <button class="full" onclick="logout()">
        Log Out
    </button>

</div>

<p id="status"></p>

<footer>
    Made for ANTHELEM & OLLEN ❤️
    <br>
    JUST US — Our Little Universe
</footer>

</div>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL = "https://evjlynbodtafarmvjfwh.supabase.co";

const SUPABASE_KEY = "sb_publishable_JHj-0hrqKfBl3WEpjSuysw_3kIOFcKF";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// OUR TWO ACCOUNTS

const ANTHELEM = "b24c352b-3c3f-4a18-b5eb-97bcc3f77e8f";

const OLLEN = "1bb864a0-cd4f-4a6f-84ec-cc20aee25661";

let currentUser = null;
let refreshTimer = null;
let messageChannel = null;


// FLOATING ROMANTIC ANIMATIONS

const romanticSymbols = [
    "❤️","💕","💗","🌹",
    "🌸","🌷","💖","✨"
];

function createFloatingItem() {

    const container =
        document.getElementById("floating-romance");

    const item = document.createElement("span");

    item.className = "floating-item";

    item.textContent =
        romanticSymbols[
            Math.floor(Math.random() * romanticSymbols.length)
        ];

    item.style.left = Math.random() * 100 + "%";

    item.style.fontSize =
        (15 + Math.random() * 19) + "px";

    const duration = 9 + Math.random() * 9;

    item.style.animationDuration = duration + "s";

    container.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, duration * 1000);
}

setInterval(createFloatingItem, 1200);


// LOGIN

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    document.getElementById("loginError").innerText =
        "Checking login...";

    const {data,error} = await db.auth.signInWithPassword({
        email,
        password
    });

    if(error) {
        document.getElementById("loginError").innerText =
            error.message;
        return;
    }

    await startApp(data.user);
}


// START APPLICATION

async function startApp(user) {

    if(user.id !== ANTHELEM && user.id !== OLLEN) {

        await db.auth.signOut();

        document.getElementById("loginError").innerText =
            "This account is not authorized.";

        return;
    }

    currentUser = user;

    document.getElementById("loginScreen").classList.add("hidden");

    document.getElementById("app").classList.remove("hidden");

    document.getElementById("welcome").innerText =
        user.id === ANTHELEM
        ? "Hello ANTHELEM ❤️"
        : "Hello OLLEN ❤️";

    await loadMessages();
    subscribeToMessages();

    await loadCards();
    await loadMemories();

    if(refreshTimer) clearInterval(refreshTimer);

    refreshTimer = setInterval(async () => {

        if(currentUser) {
            await loadMessages();
            await loadCards();
            await loadMemories();
        }

    }, 5000);

    document.getElementById("status").innerText =
        "Our universe is ready ✨";
}


// PAGE NAVIGATION

function showPage(page) {

    document.querySelectorAll(".page").forEach(p => {
        p.classList.add("hidden");
    });

    document.getElementById(page).classList.remove("hidden");
}


// SEND MESSAGE

async function sendMessage() {

    const content =
        document.getElementById("messageInput").value.trim();

    if(!content) return;

    const recipient =
        currentUser.id === ANTHELEM ? OLLEN : ANTHELEM;

    const {error} = await db.from("messages").insert({
        sender_id: currentUser.id,
        recipient_id: recipient,
        content: content
    });

    if(error) {
        alert(error.message);
        return;
    }

    document.getElementById("messageInput").value = "";

    await loadMessages();
}


// LOAD MESSAGES

async function loadMessages() {

    if(!currentUser) return;

    const {data,error} = await db
        .from("messages")
        .select("*")
        .order("created_at",{ascending:true});

    if(error) {
        console.error(error);
        return;
    }

    const box = document.getElementById("messages");

    box.innerHTML = "";

    data.forEach(msg => {

        const div = document.createElement("div");

        div.className = "message " +
            (msg.sender_id === currentUser.id ? "mine" : "");

        const text = document.createElement("div");

        text.textContent = msg.content || "";

        const time = document.createElement("small");

        time.textContent =
            new Date(msg.created_at).toLocaleString();

        div.appendChild(text);
        div.appendChild(time);

        box.appendChild(div);

    });

    box.scrollTop = box.scrollHeight;
}


// REAL-TIME MESSAGES

function subscribeToMessages() {

    if(messageChannel) {
        db.removeChannel(messageChannel);
    }

    messageChannel = db
        .channel("just-us-live-chat")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            async () => {
                await loadMessages();
            }
        )
        .subscribe();
}


// UPLOAD FILE

async function uploadFile(file, folder) {

    if(!file) {
        throw new Error("Please select an image.");
    }

    if(!file.type.startsWith("image/")) {
        throw new Error("Please select an image file.");
    }

    if(file.size > 5 * 1024 * 1024) {
        throw new Error("Image must be smaller than 5 MB.");
    }

    const safeName =
        file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

    const path =
        currentUser.id + "/" +
        crypto.randomUUID() + "-" + safeName;

    const {error} = await db.storage
        .from("just-us-media")
        .upload(path,file);

    if(error) throw error;

    return path;
}


// UPLOAD LOVE CARD

async function uploadCard() {

    try {

        const title =
            document.getElementById("cardTitle").value.trim();

        const message =
            document.getElementById("cardMessage").value.trim();

        const file =
            document.getElementById("cardImage").files[0];

        if(!title || !message || !file) {
            alert("Please fill in all fields and select an image.");
            return;
        }

        const path = await uploadFile(file,"cards");

        const {error} = await db.from("love_cards").insert({

            created_by: currentUser.id,
            title: title,
            message: message,
            image_url: path

        });

        if(error) throw error;

        alert("Your love card has been saved! ❤️");

        document.getElementById("cardTitle").value = "";
        document.getElementById("cardMessage").value = "";
        document.getElementById("cardImage").value = "";

        await loadCards();

    } catch(error) {
        alert(error.message);
    }

}


// LOAD LOVE CARDS

async function loadCards() {

    if(!currentUser) return;

    const {data,error} = await db
        .from("love_cards")
        .select("*")
        .order("created_at",{ascending:false});

    if(error) {
        console.error(error);
        return;
    }

    const gallery =
        document.getElementById("cardGallery");

    gallery.innerHTML = "";

    for(const card of data) {

        const {data:image,error:imageError} = await db.storage
            .from("just-us-media")
            .createSignedUrl(card.image_url,3600);

        const item = document.createElement("div");

        item.className = "card";

        const title = document.createElement("h3");

        title.textContent = card.title;

        const message = document.createElement("p");

        message.textContent = card.message;

        item.appendChild(title);

        if(image && !imageError) {

            const img = document.createElement("img");

            img.src = image.signedUrl;

            item.appendChild(img);

        }

        item.appendChild(message);

        gallery.appendChild(item);

    }
}


// UPLOAD MEMORY

async function uploadMemory() {

    try {

        const file =
            document.getElementById("memoryImage").files[0];

        if(!file) {
            alert("Select a picture first.");
            return;
        }

        const path = await uploadFile(file,"memories");

        const {error} = await db.from("love_cards").insert({

            created_by: currentUser.id,
            title: "Our Memory",
            message: "A special moment ❤️",
            image_url: path

        });

        if(error) throw error;

        alert("Memory saved successfully! ❤️");

        document.getElementById("memoryImage").value = "";

        await loadMemories();

    } catch(error) {
        alert(error.message);
    }

}


// LOAD MEMORIES

async function loadMemories() {

    if(!currentUser) return;

    const {data,error} = await db
        .from("love_cards")
        .select("*")
        .eq("title","Our Memory")
        .order("created_at",{ascending:false});

    if(error) {
        console.error(error);
        return;
    }

    const gallery =
        document.getElementById("memoryGallery");

    gallery.innerHTML = "";

    for(const memory of data) {

        const {data:image,error:imageError} = await db.storage
            .from("just-us-media")
            .createSignedUrl(memory.image_url,3600);

        if(image && !imageError) {

            const img = document.createElement("img");

            img.src = image.signedUrl;

            gallery.appendChild(img);

        }

    }

}


// LOGOUT

async function logout() {

    if(refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
    }

    if(messageChannel) {
        await db.removeChannel(messageChannel);
        messageChannel = null;
    }

    await db.auth.signOut();

    currentUser = null;

    document.getElementById("app").classList.add("hidden");

    document.getElementById("loginScreen").classList.remove("hidden");

    document.getElementById("password").value = "";

    document.getElementById("status").innerText = "";

}


// CHECK EXISTING SESSION

async function checkSession() {

    const {data} = await db.auth.getSession();

    if(data.session) {
        await startApp(data.session.user);
    }

}

checkSession();

</script>

</body>
</html>
